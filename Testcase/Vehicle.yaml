# Vehicle API Test Context

## CTX-VEHICLE-01 – Thêm Vehicle hợp lệ
- **Precondition:** Staff có quyền quản lý Vehicle.
- **Input:** Vehicle Type, License Plate và thông tin cần thiết hợp lệ.
- **Expected Output:** HTTP 201 Created; Vehicle được tạo thành công.

## CTX-VEHICLE-02 – Cập nhật thông tin Vehicle
- **Precondition:** Vehicle tồn tại và Staff có quyền.
- **Input:** Vehicle ID và thông tin cập nhật hợp lệ.
- **Expected Output:** HTTP 200; thông tin Vehicle được cập nhật.

## CTX-VEHICLE-03 – Vehicle không tồn tại
- **Precondition:** Không có Vehicle tương ứng.
- **Input:** Vehicle ID không tồn tại.
- **Expected Output:** HTTP 404 Not Found.

## CTX-VEHICLE-04 – User không có quyền quản lý Vehicle
- **Precondition:** User không có quyền Staff.
- **Input:** Request quản lý Vehicle.
- **Expected Output:** HTTP 403 Forbidden.
