# Booking API Test Context

## CTX-BOOK-01 – Tạo booking hợp lệ
- **Precondition:** Customer đã đăng nhập.
- **Input:** Pickup Location, Destination, Vehicle Type hợp lệ.
- **Expected Output:** HTTP 201 Created; booking được tạo thành công.

## CTX-BOOK-02 – Thiếu điểm đón
- **Precondition:** Customer đã đăng nhập.
- **Input:** Thiếu Pickup Location.
- **Expected Output:** HTTP 400 Bad Request.

## CTX-BOOK-03 – Thiếu điểm đến
- **Precondition:** Customer đã đăng nhập.
- **Input:** Thiếu Destination.
- **Expected Output:** HTTP 400 Bad Request.

## CTX-BOOK-04 – Thiếu loại xe
- **Precondition:** Customer đã đăng nhập.
- **Input:** Thiếu Vehicle Type.
- **Expected Output:** HTTP 400 Bad Request.

## CTX-BOOK-05 – Vehicle Type không hợp lệ
- **Precondition:** Customer đã đăng nhập.
- **Input:** Vehicle Type không thuộc loại xe được hỗ trợ.
- **Expected Output:** HTTP 400 Bad Request.

## CTX-BOOK-06 – Tạo booking khi chưa đăng nhập
- **Precondition:** Customer chưa đăng nhập.
- **Input:** Booking hợp lệ nhưng không có access token hợp lệ.
- **Expected Output:** HTTP 401 Unauthorized.

## CTX-BOOK-07 – Xem booking tồn tại
- **Precondition:** Booking tồn tại và Customer có quyền truy cập.
- **Input:** Booking ID hợp lệ.
- **Expected Output:** HTTP 200; trả về thông tin booking.

## CTX-BOOK-08 – Xem booking không tồn tại
- **Precondition:** Không có booking tương ứng.
- **Input:** Booking ID không tồn tại.
- **Expected Output:** HTTP 404 Not Found.
