# Customer API Test Context

## CTX-CUSTOMER-01 – Customer xem thông tin cá nhân
- **Precondition:** Customer đã đăng nhập.
- **Input:** Access token hợp lệ.
- **Expected Output:** HTTP 200; trả về thông tin Customer.

## CTX-CUSTOMER-02 – Customer cập nhật thông tin cá nhân
- **Precondition:** Customer đã đăng nhập.
- **Input:** Thông tin cập nhật hợp lệ.
- **Expected Output:** HTTP 200; thông tin Customer được cập nhật.

## CTX-CUSTOMER-03 – Cập nhật thông tin không hợp lệ
- **Precondition:** Customer đã đăng nhập.
- **Input:** Dữ liệu không hợp lệ.
- **Expected Output:** HTTP 400 Bad Request.

## CTX-CUSTOMER-04 – Customer truy cập khi chưa đăng nhập
- **Precondition:** Không có access token hợp lệ.
- **Input:** Request đến Customer API.
- **Expected Output:** HTTP 401 Unauthorized.
