# Authentication API Test Cases

## 1. Context

### API
`POST /api/auth/login`

### Actor
- Customer
- Driver
- Staff

### Authentication
- Login API không yêu cầu Bearer Token.

### Request
```json
{
  "phone": "0901234567",
  "password": "Password@123"
}
```

### Response thành công
- HTTP `200 OK`
- Trả về:
  - `token`
  - `userId`
  - `role`
- `role`: `CUSTOMER | DRIVER | STAFF`

### Business Rules
- Người dùng phải xác thực trước khi sử dụng các chức năng được bảo vệ.
- Phone/password không hợp lệ phải bị từ chối.
- Không trả password trong response.

### Exception
- `INVALID_CREDENTIALS` khi thông tin đăng nhập không hợp lệ.

