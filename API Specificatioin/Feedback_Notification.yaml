openapi: 3.0.3
info:
  title: Feedback and Notification API Specification - CAB System
  description: |
    API xử lý hai nhóm chức năng hỗ trợ cho quá trình booking, trip và payment:
    1. Part A - Feedback API: Đánh giá và phản hồi về chuyến đi sau khi hoàn thành.
    2. Part B - Notification API: Tạo và gửi các thông báo cơ bản dựa trên các sự kiện nghiệp vụ trong hệ thống.
  version: 1.0.0

servers:
  - url: https://api.cabsystem.com
    description: Production Server
  - url: https://staging-api.cabsystem.com
    description: Staging Server

tags:
  - name: Feedback
    description: API phục vụ đánh giá, phản hồi chuyến đi (Khách hàng)
  - name: Notifications
    description: API gửi thông báo hệ thống dựa trên các sự kiện nghiệp vụ (Hệ thống nội bộ)

paths:
  /api/trips/{tripId}/rating:
    post:
      tags:
        - Feedback
      summary: FEEDBACK-01 – Đánh giá chuyến đi
      description: |
        Cho phép khách hàng đánh giá (điểm số, bình luận) về chuyến đi sau khi chuyến đã hoàn thành.
        
        **Actor:** Customer
        
        **Mapping yêu cầu:**
        - FR17 – Đánh giá chuyến đi
        - UC08 – Lịch sử và đánh giá
        - AC09 – Khách hàng đánh giá sau chuyến
        - TC17 – Kiểm tra đánh giá
        
        **Business Rules:**
        - BRL12: Chỉ được đánh giá sau khi chuyến hoàn thành.
        - Mỗi chuyến chỉ được đánh giá theo chính sách của hệ thống.
      operationId: createTripRating
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID duy nhất của chuyến đi cần đánh giá
          schema:
            type: string
          example: "trip_99887766"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
      responses:
        '201':
          description: Đánh giá chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          description: Chuyến đi chưa hoàn thành hoặc dữ liệu không hợp lệ (TRIP_NOT_COMPLETED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "TRIP_NOT_COMPLETED"
                message: "Rating is only allowed after trip completion"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Không tìm thấy chuyến đi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "TRIP_NOT_FOUND"
                message: "Trip not found"

  /api/notifications:
    post:
      tags:
        - Notifications
      summary: NOTI-01 – Gửi thông báo
      description: |
        Hệ thống tạo và gửi các thông báo cơ bản đến người dùng dựa trên các sự kiện nghiệp vụ.
        
        **Source / Actor:** Internal System
        
        **Mapping yêu cầu:**
        - FR21 – Thông báo
        - AC11 – Người dùng nhận được thông báo phù hợp với sự kiện nghiệp vụ
        - TC21 – Kiểm tra thông báo
        
        **Business Rules:**
        - BRL07: Nếu không tìm được tài xế phù hợp, hệ thống phải thông báo cho khách hàng (NO_DRIVER_AVAILABLE).
        - Hệ thống phải hỗ trợ các thông báo cơ bản tương ứng với các sự kiện nghiệp vụ.
        - Lỗi gửi thông báo không được làm dừng quá trình booking hoặc trip.
        
        **Exceptions:**
        - EX11: Notification Provider không phản hồi.
        - EX12: Gửi thông báo thất bại.
      operationId: sendNotification
      security:
        - InternalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: Thông báo đã được gửi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          description: Loại thông báo hoặc thông tin người nhận không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "INVALID_NOTIFICATION_DATA"
                message: "Recipient ID and valid notification type are required"
        '500':
          description: Lỗi gửi thông báo từ phía provider hoặc hệ thống (EX11 / EX12).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "NOTIFICATION_SEND_FAILED"
                message: "Notification provider did not respond or failed to send"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dùng cho Customer xác thực API đánh giá chuyến đi
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
      description: API Key dùng cho việc gửi thông báo từ hệ thống nội bộ

  responses:
    UnauthorizedError:
      description: Người dùng chưa đăng nhập hoặc Token không hợp lệ / hết hạn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "UNAUTHORIZED"
            message: "Missing or invalid authorization token"

  schemas:
    CreateRatingRequest:
      type: object
      required:
        - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: Số điểm đánh giá (từ 1 đến 5 sao)
          example: 5
        comment:
          type: string
          description: Bình luận hoặc nhận xét của khách hàng
          example: "Tài xế thân thiện, xe sạch sẻ và lái xe rất an toàn."

    RatingResponse:
      type: object
      required:
        - ratingId
        - tripId
        - score
        - comment
      properties:
        ratingId:
          type: string
          description: ID duy nhất của bản ghi đánh giá
          example: "rat_11223344"
        tripId:
          type: string
          description: ID chuyến đi được đánh giá
          example: "trip_99887766"
        score:
          type: integer
          example: 5
        comment:
          type: string
          example: "Tài xế thân thiện, xe sạch sẻ và lái xe rất an toàn."

    CreateNotificationRequest:
      type: object
      required:
        - recipientId
        - type
        - message
      properties:
        recipientId:
          type: string
          description: ID của người nhận thông báo (Customer / Driver / Staff)
          example: "usr_cust_12345"
        type:
          type: string
          description: Loại thông báo sự kiện nghiệp vụ
          enum:
            - BOOKING_CREATED
            - DRIVER_ASSIGNED
            - DRIVER_ARRIVING
            - TRIP_STARTED
            - TRIP_COMPLETED
            - PAYMENT_SUCCESS
            - PAYMENT_FAILED
            - NO_DRIVER_AVAILABLE
          example: "DRIVER_ASSIGNED"
        message:
          type: string
          description: Nội dung thông báo hiển thị cho người dùng
          example: "Tài xế Trần Văn B đã nhận chuyến xe của bạn."

    NotificationResponse:
      type: object
      required:
        - notificationId
        - status
      properties:
        notificationId:
          type: string
          description: ID duy nhất của thông báo
          example: "noti_55667788"
        status:
          type: string
          description: Trạng thái gửi thông báo
          enum:
            - SENT
            - FAILED
          example: "SENT"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "TRIP_NOT_COMPLETED"
        message:
          type: string
          example: "Rating is only allowed after trip completion"
