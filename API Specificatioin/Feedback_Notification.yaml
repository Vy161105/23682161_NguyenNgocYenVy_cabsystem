# PART B – NOTIFICATION API

## 3. NOTI-01 – Gửi thông báo

### Endpoint

POST `/api/notifications`

### Description

Hệ thống tạo và gửi các thông báo cơ bản đến người dùng dựa trên các sự kiện nghiệp vụ.

### Source

Internal System

### Authentication

Internal API

### Request Body

{
  "recipientId": "<recipient_id>",
  "type": "<BOOKING_CREATED|DRIVER_ASSIGNED|DRIVER_ARRIVING|TRIP_STARTED|TRIP_COMPLETED|PAYMENT_SUCCESS|PAYMENT_FAILED|NO_DRIVER_AVAILABLE>",
  "message": "<message>"
}

### Success Response – 201 Created

{
  "notificationId": "<notification_id>",
  "status": "SENT"
}

### Notification Types

- BOOKING_CREATED – Tạo booking thành công
- DRIVER_ASSIGNED – Đã phân công tài xế
- DRIVER_ARRIVING – Tài xế đang đến điểm đón
- TRIP_STARTED – Chuyến đi bắt đầu
- TRIP_COMPLETED – Chuyến đi hoàn thành
- PAYMENT_SUCCESS – Thanh toán thành công
- PAYMENT_FAILED – Thanh toán thất bại
- NO_DRIVER_AVAILABLE – Không tìm được tài xế

### Business Rules

- BRL07: Nếu không tìm được tài xế phù hợp, hệ thống phải thông báo cho khách hàng.
- Hệ thống phải hỗ trợ các thông báo cơ bản tương ứng với các sự kiện nghiệp vụ.
- Lỗi gửi thông báo không được làm dừng quá trình booking hoặc trip.

### Exceptions

- EX11: Notification Provider không phản hồi.
- EX12: Gửi thông báo thất bại.

### Mapping

- FR21 – Thông báo
- AC11 – Người dùng nhận được thông báo phù hợp với sự kiện nghiệp vụ
- TC21 – Kiểm tra thông báo
