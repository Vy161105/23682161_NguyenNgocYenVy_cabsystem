# Feedback and Notification API Specification

## 1. Tổng quan

API xử lý hai nhóm chức năng:
- Đánh giá/phản hồi chuyến đi.
- Gửi các thông báo cơ bản trong quá trình đặt và thực hiện chuyến.

Hai chức năng được đặt chung trong một API specification vì đều là các chức năng hỗ trợ cho quá trình booking, trip và payment.

---

# PART A – FEEDBACK API

## 2. FEEDBACK-01 – Đánh giá chuyến đi

### Endpoint

POST `/api/trips/{tripId}/rating`

### Description

Cho phép khách hàng đánh giá và phản hồi về chuyến đi sau khi chuyến đã hoàn thành.

### Actor

Customer

### Authentication

Bearer Token

### Request Body

{
  "score": "<score>",
  "comment": "<comment>"
}

### Success Response – 201 Created

{
  "ratingId": "<rating_id>",
  "tripId": "<trip_id>",
  "score": "<score>",
  "comment": "<comment>"
}

### Business Rules

- BRL12: Chỉ được đánh giá sau khi chuyến hoàn thành.
- Mỗi chuyến chỉ được đánh giá theo chính sách của hệ thống.

### Error Response – 400 Bad Request

{
  "code": "TRIP_NOT_COMPLETED",
  "message": "Rating is only allowed after trip completion"
}

### Mapping

- FR17 – Đánh giá chuyến đi
- UC08 – Lịch sử và đánh giá
- AC09 – Khách hàng đánh giá sau chuyến
- TC17 – Kiểm tra đánh giá

