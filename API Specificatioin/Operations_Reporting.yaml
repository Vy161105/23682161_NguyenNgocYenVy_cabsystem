# Operations and Reporting API Specification

## 1. Tổng quan

API phục vụ hoạt động vận hành và báo cáo của CAB System, bao gồm:
- Quản lý Customer.
- Quản lý Driver.
- Quản lý Vehicle.
- Quản lý Trip.
- Theo dõi các chuyến đang diễn ra.
- Xem báo cáo vận hành cơ bản.

### Actor

- Staff

### Mapping yêu cầu

- FR18 – Quản lý khách hàng, tài xế, phương tiện, chuyến
- FR19 – Giám sát chuyến đang diễn ra
- FR20 – Báo cáo
- UC09 – Quản lý vận hành
- UC10 – Báo cáo
- AC10 – Staff quản lý và giám sát
- TC18–TC20

---

# PART A – OPERATIONS MANAGEMENT API

## 2. OPS-01 – Quản lý khách hàng

### Endpoint

GET `/api/operations/customers`

### Description

Cho phép Staff xem danh sách khách hàng để phục vụ công tác quản lý vận hành.

### Authentication

Bearer Token

### Success Response – 200 OK

{
  "data": [
    {
      "customerId": "<customer_id>",
      "fullName": "<full_name>",
      "phone": "<phone>",
      "email": "<email>"
    }
  ]
}

### Business Rules

- Chỉ Staff được phân quyền mới được truy cập.
- BRL13: Chỉ người dùng được phân quyền mới được quản lý hoặc xem dữ liệu vận hành.

---

## 3. OPS-02 – Quản lý tài xế

### Endpoint

GET `/api/operations/drivers`

### Description

Cho phép Staff xem danh sách và thông tin tài xế phục vụ quản lý vận hành.

