---

## 6. OPS-05 – Theo dõi chuyến đang diễn ra

### Endpoint

GET `/api/operations/trips/ongoing`

### Description

Cho phép Staff theo dõi các chuyến đang diễn ra để giám sát tình trạng vận hành.

### Authentication

Bearer Token

### Success Response – 200 OK

{
  "data": [
    {
      "tripId": "<trip_id>",
      "driverId": "<driver_id>",
      "status": "<status>",
      "location": {
        "latitude": "<latitude>",
        "longitude": "<longitude>"
      }
    }
  ]
}

### Business Rules

- Chỉ Staff được phân quyền mới được truy cập.
- Dữ liệu phải phục vụ việc giám sát các chuyến đang diễn ra.

### Mapping

- FR19 – Giám sát chuyến đang diễn ra
- UC09 – Quản lý vận hành
- AC10 – Staff quản lý và giám sát
- TC19 – Kiểm tra giám sát chuyến

