## 5. OPS-04 – Quản lý chuyến

### Endpoint

GET `/api/operations/trips`

### Description

Cho phép Staff xem danh sách chuyến để phục vụ quản lý vận hành.

### Authentication

Bearer Token

### Success Response – 200 OK

{
  "data": [
    {
      "tripId": "<trip_id>",
      "bookingId": "<booking_id>",
      "driverId": "<driver_id>",
      "status": "<status>"
    }
  ]
}

### Business Rules

- Chỉ Staff được phân quyền mới được truy cập.
